# nginx/nginx.scale.conf
#
# Nginx reverse-proxy / load-balancer configuration for SPIS backend.
# Designed for docker-compose.scale.yml (3 replicas per service).
#
# Features:
#   - least_conn load balancing
#   - Per-service upstream blocks
#   - Security headers
#   - Rate-limit zones (per-IP)
#   - Keepalive connections to upstream
#   - Gzip compression
#   - Health check passthrough

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── General ──────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # ── Gzip ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        application/json application/javascript text/plain text/css;

    # ── Rate Limit Zones (per-IP) ────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;

    # ── Upstream Blocks (least_conn) ─────────────────────────────
    upstream iam_backend {
        least_conn;
        server iam-service:3003;
        keepalive 16;
    }

    upstream family_backend {
        least_conn;
        server family-service:3001;
        keepalive 16;
    }

    upstream email_backend {
        least_conn;
        server email-service:3002;
        keepalive 16;
    }

    upstream programme_backend {
        least_conn;
        server programme-service:3004;
        keepalive 16;
    }

    # ── Server Block ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options    nosniff       always;
        add_header X-Frame-Options           DENY          always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           no-referrer   always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ── IAM Service (/iam/*, /api/v1/auth/*) ────────────────
        location /iam/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://iam_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://iam_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ── Family Service (/api/v1/families/*, etc.) ────────────
        location /api/v1/families {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://family_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/members {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://family_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/addresses {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://family_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ── Email Service (/email/*) ─────────────────────────────
        location /email/ {
            limit_req zone=api_general burst=10 nodelay;
            proxy_pass http://email_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ── Programme Service (/api/v1/programmes/*) ─────────────
        location /api/v1/programmes {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://programme_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ── Health checks ────────────────────────────────────────
        location = /iam/healthz {
            proxy_pass http://iam_backend/healthz;
        }
        location = /family/healthz {
            proxy_pass http://family_backend/healthz;
        }
        location = /email/healthz {
            proxy_pass http://email_backend/healthz;
        }
        location = /programme/healthz {
            proxy_pass http://programme_backend/healthz;
        }
    }
}
